<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardio Mine</title>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
body{font-family:Arial;background:#0a0a0a;color:white;text-align:center;margin:0;padding:20px}
.card{background:#1a1a1a;border-radius:15px;padding:20px;margin:15px auto;max-width:400px}
button{background:#0088cc;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:16px;margin:5px;width:90%}
.progress{width:90%;background:#333;height:20px;border-radius:10px;margin:10px auto}
.bar{height:100%;background:#00ff88;border-radius:10px;width:0%}
h2{color:#00ff88}
</style>
</head>
<body>

<h1>💎 Cardio Mine</h1>
<div class="card">
<h2 id="balance">Balance: 0 TON</h2>
<div class="progress"><div id="mineBar" class="bar"></div></div>
<button onclick="mine()">⛏ Mine</button>
</div>

<div class="card">
<h3>📋 Tasks</h3>
<p>Watch Ads: <span id="adCount">0</span>/20</p>
<div class="progress"><div id="adBar" class="bar" style="background:#0088cc"></div></div>
<button onclick="watchAd()">▶ Watch Ad</button>

<p style="margin-top:20px">Bonus Tasks: <span id="bonusCount">0</span>/100</p>
<div class="progress"><div id="bonusBar" class="bar" style="background:#ffcc00"></div></div>
<button onclick="doBonus()">🎁 Claim Bonus</button>
</div>

<div class="card">
<h3>💸 Withdraw</h3>
<p>Minimum withdrawal is 20 TON</p>
<input id="wallet" placeholder="Your TON wallet address" style="width:90%;padding:10px;border-radius:8px;border:none">
<button onclick="withdraw()" style="background:#00aa55;margin-top:10px">Withdraw</button>
</div>

<script>
let balance = parseFloat(localStorage.getItem('bal')||0);
let ads = parseInt(localStorage.getItem('ads')||0);
let bonus = parseInt(localStorage.getItem('bonus')||0);

const AdController = window.Adsgram.init({ blockId: "47932" });

function updateUI(){
document.getElementById('balance').innerText = `Balance: ${balance.toFixed(2)} TON`;
document.getElementById('adCount').innerText = ads;
document.getElementById('bonusCount').innerText = bonus;
document.getElementById('adBar').style.width = (ads/20*100)+'%';
document.getElementById('bonusBar').style.width = (bonus/100*100)+'%';
localStorage.setItem('bal', balance);
localStorage.setItem('ads', ads);
localStorage.setItem('bonus', bonus);
}
updateUI();

function mine(){
balance += 0.01;
updateUI();
}

function watchAd(){
AdController.show().then((result)=>{
if(result.done){
balance += 0.5;
ads++;
if(ads>20) ads=20;
updateUI();
alert("You earned +0.5 TON!");
}
}).catch(()=>{alert("Ad not ready, try again")});
}

function doBonus(){
if(bonus>=100){alert("Bonus completed!"); return;}
bonus++;
balance += 0.1;
if(bonus>100) bonus=100;
updateUI();
}

function withdraw(){
let w = document.getElementById('wallet').value;
if(balance < 20){alert("Minimum withdrawal is 20 TON"); return;}
if(!w){alert("Enter wallet address"); return;}
alert("Withdrawal request sent for "+balance+" TON to "+w);
}
</script>
</body>
</html>
