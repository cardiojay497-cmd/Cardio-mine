<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardioMine</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#0a0f1e;color:white;text-align:center;font-family:Arial;margin:0;padding:20px}
h1{color:#00f2ff}
#score{font-size:50px;margin:20px;font-weight:bold}
#coin{font-size:120px;cursor:pointer;user-select:none;transition:0.1s}
#coin:active{transform:scale(0.9)}
#energy{margin-top:20px;color:#aaa}
.bar{width:80%;height:15px;background:#222;border-radius:10px;margin:10px auto;overflow:hidden}
#fill{height:100%;width:100%;background:#00f2ff;transition:0.2s}
button{background:#00f2ff;color:#000;border:0;padding:12px 25px;border-radius:20px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<h1>❤️ CardioMine</h1>
<div id="score">0</div>
<div id="coin" onclick="tap()">❤️</div>
<div id="energy">Energy: <span id="en">1000</span>/1000</div>
<div class="bar"><div id="fill"></div></div>
<button onclick="claim()">Claim</button>

<script>
let score = parseInt(localStorage.getItem('cm_score')||'0');
let energy = parseInt(localStorage.getItem('cm_energy')||'1000');
let maxEnergy = 1000;

function update(){
 document.getElementById('score').innerText = score;
 document.getElementById('en').innerText = energy;
 document.getElementById('fill').style.width = (energy/maxEnergy*100)+'%';
 localStorage.setItem('cm_score', score);
 localStorage.setItem('cm_energy', energy);
}

function tap(){
 if(energy>0){
   score+=1;
   energy-=1;
   if(window.Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
   update();
 }
}

function claim(){
 if(window.Telegram.WebApp){
   Telegram.WebApp.sendData(JSON.stringify({score:score}));
 }
 alert("Saved! Your balance: "+score);
}

update();

// auto refill energy every 2 seconds
setInterval(()=>{
 if(energy<maxEnergy){energy+=1; update();}
},2000);

Telegram.WebApp.ready();
Telegram.WebApp.expand();
</script>
</body>
</html>
